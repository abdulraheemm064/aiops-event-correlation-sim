[project]
name = "aiops-event-correlation-sim"
version = "1.0.0"
description = "Synthetic monitoring alert generator and AIOps-style pipeline: dedup, flap suppression, time+topology correlation, priority scoring and root-cause candidates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abdul Raheem Mohammed" }]
dependencies = ["matplotlib==3.11.2"]

[project.scripts]
aiops-sim = "aiops_sim.cli:main"

[tool.setuptools]
packages = ["aiops_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
